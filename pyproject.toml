[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-models"
version = "0.1.0"
description = "Training and evaluation code for the ISMIR 2026 paper on estimating the proportion of AI-generated stems in hybrid music mixtures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
authors = [
    {name = "Fernando Garcia"}
]
dependencies = [
    # Core
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",

    # Audio
    "librosa>=0.10",
    "soundfile>=0.12",

    # ML / metrics
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "scipy>=1.10",

    # Experiment tracking
    "mlflow>=2.11",

    # TensorFlow (primary ML framework for MVP)
    "tensorflow==2.15.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
]
all = [
    "detector-models[dev]",
]

[project.urls]
Paper = "https://arxiv.org/abs/2608.07285"
Thesis = "https://zenodo.org/records/23186445"
Website = "https://fergarciadlc.github.io/ismir26-how-much-ai/"
Repository = "https://github.com/fergarciadlc/detector-models"
ARIA = "https://github.com/fergarciadlc/aria"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# ── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Mypy ────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-models"
version = "0.1.0"
description = "MLOps pipeline for AI-generated audio detection"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",

    # Audio
    "librosa>=0.10",
    "soundfile>=0.12",

    # ML / metrics
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "scipy>=1.10",

    # Experiment tracking
    "mlflow>=2.11",

    # TensorFlow (primary ML framework for MVP)
    "tensorflow==2.15.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
]
all = [
    "detector-models[dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# ── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Mypy ────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

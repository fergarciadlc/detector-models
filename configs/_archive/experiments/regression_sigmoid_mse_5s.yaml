experiment:
  name: regression_sigmoid_mse_5s
  description: "Regression CNN on ARIA, from scratch — sigmoid + MSE 5s crops, no BatchNorm"
  mlflow_experiment: aria-regression-baselines
  tags:
    task: regression_sigmoid_mse_5s
    strategy: from_scratch

dataset: configs/datasets/aria.yaml
features: configs/features/stft_db_44k.yaml
model: configs/models/spec_cnn_regression_v1.yaml

training:
  epochs: 100
  batch_size: 50
  learning_rate: 0.001
  optimizer: adam
  seed: 123

  crop:
    window_sec: 5.0
    strategy: random
    samples_per_file: 2

  shuffle_buffer_multiplier: 2

  callbacks:
    early_stopping:
      monitor: val_mae
      patience: 15
    reduce_lr:
      monitor: val_mae
      factor: 0.5
      patience: 5

  augmentation:
    enabled: false

evaluation:
  metrics: [mae, rmse, r2, pearson, spearman]
  plots: [prediction_scatter, error_by_alpha_bucket, median_pred_by_alpha_bucket]
  threshold_sweep:
    enabled: false

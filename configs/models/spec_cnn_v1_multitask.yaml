model:
  name: spec_cnn_v1_multitask
  type: spectrogram_cnn

  backbone:
    filters:  [16, 32, 64, 128, 256, 512]
    kernels:  [3, 3, 3, 3, 3, 3]
    strides:  [2, 2, 2, 2, 2, 2]
    use_maxpool: true
    activation: relu
    batch_norm: true
    pooling: average
    padding: same

  head:
    dense_units: 128
    activation: swish
    dropout: 0.2

  output:
    type: multitask
    regression:
      activation: sigmoid         # bounded [0, 1] for α
      loss: mse
    binary_head:
      activation: sigmoid         # "any AI present?"
      loss: binary_crossentropy
      weight: 0.5                 # λ in combined loss

experiment:
  name: aria_multitask_scratch
  description: "Multitask CNN (regression + binary) on ARIA, trained from scratch"
  mlflow_experiment: aria-regression-baselines
  tags:
    task: ai_proportion_regression
    strategy: from_scratch
  limit: null

dataset: configs/datasets/aria.yaml
features: configs/features/stft_db_44k.yaml
model: configs/models/spec_cnn_v1_multitask.yaml

training:
  epochs: 100
  batch_size: 50
  learning_rate: 0.001
  optimizer: adam
  seed: 123

  crop:
    window_sec: 1.0
    strategy: random
    samples_per_file: 5

  shuffle_buffer_multiplier: 2

  callbacks:
    early_stopping:
      monitor: val_regression_output_mae
      patience: 15
    reduce_lr:
      monitor: val_regression_output_mae
      factor: 0.5
      patience: 5

  augmentation:
    enabled: false

evaluation:
  metrics: [mae, rmse]
  plots: [prediction_scatter, error_by_alpha_bucket]
  threshold_sweep:
    enabled: false
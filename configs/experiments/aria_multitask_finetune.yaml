experiment:
  name: aria_multitask_finetune
  description: "Multitask CNN on ARIA, fine-tuned from binary detector"
  mlflow_experiment: aria-regression-baselines
  tags:
    task: ai_proportion_regression
    strategy: fine_tune

dataset: configs/datasets/aria.yaml
features: configs/features/stft_db_44k.yaml
model: configs/models/spec_cnn_v1_multitask.yaml

training:
  epochs: 100
  batch_size: 50
  learning_rate: 0.0001                # 10x lower than from-scratch
  optimizer: adam
  seed: 123

  # ── Fine-tuning ──
  pretrained_weights: data/artifacts/cnn_mtg_stft_db_44k_fma_medium_encodec/best_model.keras
  freeze_backbone_epochs: 5

  crop:
    window_sec: 1.0
    strategy: random
    samples_per_file: 5

  shuffle_buffer_multiplier: 2

  callbacks:
    early_stopping:
      monitor: val_regression_output_mae
      patience: 15
    reduce_lr:
      monitor: val_regression_output_mae
      factor: 0.5
      patience: 5

  augmentation:
    enabled: false

evaluation:
  metrics: [mae, rmse]
  plots: [prediction_scatter, error_by_alpha_bucket]
  threshold_sweep:
    enabled: false

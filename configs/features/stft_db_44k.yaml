features:
  name: stft_db_44k
  type: stft_magnitude_db

  audio:
    sample_rate: 44100
    mono: true
    hf_cut_hz: 16000

  stft:
    n_fft: 2048
    win_length: 2048
    hop_length: 512

  normalization:
    strategy: fixed
    mean: -4.0
    std: 3.0

  # null = full file. Set to a number (seconds) to cap extraction length and
  # dramatically reduce .npy file size (e.g. 30 → ~7MB instead of ~59MB).
  # The segment is chosen deterministically per file so re-extraction is stable.
  max_duration_sec: 15

  storage: full
  output_format: npy
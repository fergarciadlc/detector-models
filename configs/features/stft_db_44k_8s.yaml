features:
  name: stft_db_44k_8s
  type: stft_magnitude_db

  audio:
    sample_rate: 44100
    mono: true
    hf_cut_hz: 16000

  stft:
    n_fft: 2048
    win_length: 2048
    hop_length: 512

  normalization:
    strategy: fixed
    mean: -4.0
    std: 3.0

  # Truncated to 8s: large enough for the 5s training crop (427 frames) with
  # ~3s of random-start slack, small enough to fit ~102G on the SSD so training
  # is not HDD-I/O-bound. The paper's features were made by slicing the first 8s
  # of the full-length stft_db_44k features (scripts/slice_features_duration.py).
  # Re-extracting with max_duration_sec=8 picks a different start offset and dB
  # reference, so it does not reproduce them exactly.
  max_duration_sec: 8

  storage: full
  output_format: npy

dataset:
  name: fma_medium
  description: "FMA small vs AI-rebuilt FMA medium"
  limit: null

  paths:
    # Used by the Docker Makefile volume layout.
    # If DATASETS_REAL_DIR/DATASETS_FAKE_DIR are set, these map to:
    #   - /datasets/real
    #   - /datasets/fake
    #
    # If instead a single DATASETS_DIR is mounted at /datasets, place both
    # datasets under /datasets/real and /datasets/fake.
    real: /datasets/real/fma/fma_medium
    fake: /datasets/fake/fma_rebuilt_medium

  format: mp3

  split:
    strategy: stratified   # stratified | random | predefined
    ratios: [0.70, 0.10, 0.20]   # train / val / test
    seed: 123